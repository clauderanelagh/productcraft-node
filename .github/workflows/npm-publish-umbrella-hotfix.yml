name: npm publish umbrella hotfix

# One-shot repair for a half-published release: release.yml published the
# `productcraft` umbrella pointing at a @productcraft/* version the token
# was then refused to publish, so `latest` resolves to nothing installable.
# Tokens are also refused for dist-tag moves, but a publish of THIS package
# is allowed, and a publish moves `latest`. So: publish the umbrella again
# at a new version with the offending dependency range set back to the
# newest version that exists on npm. Everything else about the package is
# main as-is. After it lands, commit the same version + range to the repo
# so changesets does not try to republish it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "new umbrella version to publish"
        required: true
      dep:
        description: "dependency to override (e.g. @productcraft/auth)"
        required: true
        default: "@productcraft/auth"
      range:
        description: "range to publish for that dependency (e.g. ^0.6.0)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run codegen
      - run: pnpm run build
      - name: Rewrite umbrella version + dependency ranges
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs"), path = require("path");
            const p = "packages/umbrella/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.version = process.argv[1];
            if (!(process.argv[2] in j.dependencies)) throw new Error("no such dependency: " + process.argv[2]);
            // npm publish does not understand workspace:^ — resolve every
            // workspace range to the sibling package version, like pnpm
            // would, then apply the one override.
            for (const [name, range] of Object.entries(j.dependencies)) {
              if (!String(range).startsWith("workspace:")) continue;
              const dir = fs.readdirSync("packages").find((d) => {
                try { return JSON.parse(fs.readFileSync(path.join("packages", d, "package.json"), "utf8")).name === name; } catch { return false; }
              });
              if (!dir) throw new Error("workspace package not found: " + name);
              const v = JSON.parse(fs.readFileSync(path.join("packages", dir, "package.json"), "utf8")).version;
              j.dependencies[name] = "^" + v;
            }
            j.dependencies[process.argv[2]] = process.argv[3];
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            console.log(JSON.stringify({ version: j.version, dependencies: j.dependencies }, null, 2));
          ' "${{ inputs.version }}" "${{ inputs.dep }}" "${{ inputs.range }}"
      - name: Publish
        working-directory: packages/umbrella
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          # Same client and auth file shape as changesets/action, which is
          # the path that published 0.2.8 with this token; pnpm publish did
          # not pick the token up and 404'd.
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          npm whoami
          npm publish --access public
          echo "published:"; npm view "productcraft@${{ inputs.version }}" version dependencies --json
          echo "dist-tags:"; npm view productcraft dist-tags --json
