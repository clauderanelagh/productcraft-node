name: Release

# On every push to main:
#   1. Look at .changeset/*.md files for pending bumps.
#   2. If any exist, open / update the "Version Packages" PR that
#      bumps versions + updates CHANGELOG.md per package.
#   3. If no pending changesets and versions in package.json files
#      don't yet exist on npm, publish those packages via Trusted
#      Publishing (OIDC — no NPM_TOKEN secret required; see
#      packages/*/package.json#publishConfig).
#
# One-time setup per package on npmjs.com:
#   Package settings → Trusted publishers →
#   GitHub Actions, clauderanelagh/productcraft-node, release.yml.
#
# Version Packages PRs get CI (task 001, 2026-11-06): with the SDK bot App
# configured (repo variable SDK_BOT_APP_ID + secret SDK_BOT_PRIVATE_KEY) the
# changesets action pushes with its installation token and CI starts through
# the normal `pull_request` trigger. Until then it pushes with GITHUB_TOKEN,
# whose pushes don't start CI that runs, so the last step dispatches ci.yml on
# changeset-release/main. Publishing is unaffected either way: it stays npm
# trusted publishing (OIDC, bound to this file name). Edit this file in place;
# never rename or copy it.

on:
  push:
    branches: [main]
  # Snapshot previews (task 009): publish the pending changesets as
  # `<next version>-<tag>-<datetime>` under the dist-tag `<tag>`, leaving
  # `latest` alone. It lives in THIS file because the npm trusted publisher
  # is bound to the file name. Run: gh workflow run release.yml --ref main -f snapshot=next
  workflow_dispatch:
    inputs:
      snapshot:
        description: "dist-tag for a snapshot release of the pending changesets (e.g. next). Never latest."
        required: true
        type: string
        default: next

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: write # dispatch ci.yml on the Version Packages branch (fallback)
    steps:
      - name: Mint SDK bot App token
        id: app-token
        if: vars.SDK_BOT_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.SDK_BOT_APP_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # npm CLI 11.5.1+ is required for Trusted Publishing (OIDC). Node 22
      # ships with npm 10.x by default, which doesn't speak the
      # `npm publish` OIDC exchange — without this step, publishes 404
      # even with a correct trusted-publisher config on npmjs.com.
      # Pinned to 11.x: `npm@latest` (12.0.0, 2026-07) ends up missing
      # the `sigstore` module after the in-place upgrade and every
      # provenance publish dies with MODULE_NOT_FOUND (run 2026-07-09).
      - run: npm install -g npm@11
      - run: npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm run codegen
      - run: pnpm run build
      - run: pnpm run test

      - name: Create release PR or publish
        id: changesets
        if: github.event_name == 'push'
        uses: changesets/action@v1
        with:
          # `release` script builds packages then runs `changeset
          # publish`, which inspects each workspace package version
          # against the npm registry and publishes new ones.
          publish: pnpm run release
          version: pnpm run version-packages
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          # Tokenless publish via npm trusted publishing (runner OIDC,
          # `id-token: write`). No NPM_TOKEN: when one was passed, the action
          # preferred it over OIDC. Every package (productcraft and
          # @productcraft/{auth,auth-passport,core,mail,waitlist,social,trawl,
          # platform-auth} since 2026-10-23, flags-engine since 2026-11-09,
          # flags since 2026-11-10) has a GitHub Actions trusted publisher for
          # THIS workflow file, and their publishing access is
          # "require 2FA and disallow tokens". A new package needs the same
          # one-time setup on npmjs.com before its first publish from here.
          NPM_CONFIG_PROVENANCE: "true"

      # Snapshot mode: version the pending changesets as prereleases in the
      # runner's checkout only (nothing is committed or pushed), then publish
      # exactly those under the requested dist-tag.
      - name: Publish snapshot under a dist-tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.snapshot }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          if [[ ! "$TAG" =~ ^[a-z][a-z0-9-]*$ || "$TAG" == "latest" ]]; then
            echo "::error::snapshot dist-tag must be lowercase and not 'latest' (got '$TAG')"; exit 1
          fi
          if ! ls .changeset/*.md 2>/dev/null | grep -qv README.md; then
            echo "::error::no pending changesets to snapshot"; exit 1
          fi
          pnpm exec changeset version --snapshot "$TAG"
          git --no-pager diff --stat -- 'packages/*/package.json'
          pnpm run build
          pnpm exec changeset publish --tag "$TAG" --no-git-tag
          for p in packages/*/package.json; do
            node -e 'const p=require("./"+process.argv[1]); if(!p.private && p.version.includes("-")) console.log(`${p.name}@${p.version}`)' "$p"
          done

      - name: Run CI on the Version Packages branch (no App token)
        if: github.event_name == 'push' && steps.changesets.outputs.pullRequestNumber != '' && steps.app-token.outputs.token == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref changeset-release/main
          echo "Dispatched CI on changeset-release/main for PR #${{ steps.changesets.outputs.pullRequestNumber }}"
