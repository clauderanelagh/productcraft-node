name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Bot branches (chore/refresh-specs from spec-refresh.yml, changeset-release/main
  # from release.yml) are pushed with GITHUB_TOKEN unless the SDK bot App is
  # configured. Those pushes don't trigger `pull_request` runs that execute
  # (they sit in action_required), so the bot workflows dispatch this workflow
  # on their branch explicitly. The run's checks land on the branch head commit,
  # which is the PR head, so `gh pr checks` shows them.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run codegen
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test
