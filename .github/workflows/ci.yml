name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Bot branches (chore/refresh-specs from spec-refresh.yml, changeset-release/main
  # from release.yml) are pushed with GITHUB_TOKEN unless the SDK bot App is
  # configured. Those pushes don't trigger `pull_request` runs that execute
  # (they sit in action_required), so the bot workflows dispatch this workflow
  # on their branch explicitly. A PR's check rollup ignores workflow_dispatch
  # check suites, so a dispatched run also reports a `CI / build-and-test`
  # commit status on the head commit; that is what the PR shows.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    env:
      STATUS_CONTEXT: CI / build-and-test (dispatched)
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report pending status on the head commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context="$STATUS_CONTEXT" \
            -f target_url="$RUN_URL" -f description="CI running" >/dev/null
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run codegen
      - name: Checked-in generator output is current (api.md, README regions, examples)
        run: git diff --exit-code -- . ':(exclude)pnpm-lock.yaml'
      - name: Generator determinism (codegen twice in memory, diff)
        run: node scripts/gen-sdk.mjs --check
      - name: Hand-written allowlist
        run: node scripts/check-handwritten.mjs
      - run: pnpm run lint
      - run: pnpm run build
      # Includes the generator's golden + failure tests and the generated
      # per-operation test (packages/gen-fixture); CI=true makes snapshots strict.
      - run: pnpm run test
      - name: Snippet typecheck (READMEs, api.md, docs/, examples/)
        run: node scripts/check-snippets.mjs
      - name: Public API reports (api-extractor) match the committed api-report.md
        run: node scripts/api-report.mjs
      - name: Dist smoke (ESM + CJS, cross-build instanceof)
        run: node scripts/smoke-dist.mjs
      - name: Packed files (manifest.json, api.md, /testing in every generated package)
        run: node scripts/check-pack.mjs
      - name: Type resolution of the packed tarballs (attw + node16 .cts, nodenext, node10 consumers)
        run: node scripts/check-types-resolution.mjs
      - name: Built .d.ts typecheck with skipLibCheck off, public types not any
        run: node scripts/check-dts.mjs
      - name: Size budget (esbuild one-call bundle, gzip)
        run: node scripts/size-budget.mjs
      - name: ConfigCat dual-run example (both SDKs offline over equivalent fixtures)
        working-directory: examples
        run: |
          npm install --no-audit --no-fund --no-package-lock
          mkdir -p node_modules/@productcraft
          ln -sfn ../../../packages/flags node_modules/@productcraft/flags
          npm test
      - name: Report final status on the head commit
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="$STATUS_CONTEXT" \
            -f target_url="$RUN_URL" -f description="CI $JOB_STATUS" >/dev/null

  # The built dist on every supported Node line (engines: >=20.3).
  dist-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 20.3.0 is the engines floor: no require(esm) there, so it proves the CJS builds
        # never load ESM-only dependencies (jose 6; task 009).
        node: ["20.3.0", 20, 22, 24]
    name: dist-smoke (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run codegen
      - run: pnpm run build
      - run: node scripts/smoke-dist.mjs
      - name: Core contract suite
        run: pnpm --filter @productcraft/core run test

  # The Notify browser core in headless Chromium against a local SSE mock (task 018).
  # Pinned to ubuntu-24.04: Playwright 1.58 cannot install browsers on ubuntu-latest (26.04).
  notify-js-browser:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run codegen
      - run: pnpm --filter "@productcraft/notify-js..." run build
      - run: pnpm --filter @productcraft/notify-js exec playwright-core install --with-deps --only-shell chromium
      - run: pnpm --filter @productcraft/notify-js run test:browser

  # @productcraft/notify-react (task 020): headless Chromium against a local SSE mock, and the Next.js
  # App Router fixture (a Server Component renders the components, so it only builds with "use client").
  notify-react-browser:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run codegen
      - run: pnpm --filter "@productcraft/notify-react..." run build
      - run: pnpm --filter @productcraft/notify-react exec playwright-core install --with-deps --only-shell chromium
      - run: pnpm --filter @productcraft/notify-react run test:browser
      - name: Next.js App Router build fixture
        run: node examples/notify-react-next/run.mjs --local --build-only
