name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Bot branches (chore/refresh-specs from spec-refresh.yml, changeset-release/main
  # from release.yml) are pushed with GITHUB_TOKEN unless the SDK bot App is
  # configured. Those pushes don't trigger `pull_request` runs that execute
  # (they sit in action_required), so the bot workflows dispatch this workflow
  # on their branch explicitly. A PR's check rollup ignores workflow_dispatch
  # check suites, so a dispatched run also reports a `CI / build-and-test`
  # commit status on the head commit; that is what the PR shows.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    env:
      STATUS_CONTEXT: CI / build-and-test (dispatched)
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report pending status on the head commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context="$STATUS_CONTEXT" \
            -f target_url="$RUN_URL" -f description="CI running" >/dev/null
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run codegen
      - name: Checked-in generator output is current (api.md, README regions, examples)
        run: git diff --exit-code -- . ':(exclude)pnpm-lock.yaml'
      - name: Generator determinism (codegen twice in memory, diff)
        run: node scripts/gen-sdk.mjs --check
      - name: Hand-written allowlist
        run: node scripts/check-handwritten.mjs
      - run: pnpm run lint
      - run: pnpm run build
      # Includes the generator's golden + failure tests and the generated
      # per-operation test (packages/gen-fixture); CI=true makes snapshots strict.
      - run: pnpm run test
      - name: Snippet typecheck (READMEs, api.md, docs/, examples/)
        run: node scripts/check-snippets.mjs
      - name: Public API reports (api-extractor) match the committed api-report.md
        run: node scripts/api-report.mjs
      - name: Dist smoke (ESM + CJS, cross-build instanceof)
        run: node scripts/smoke-dist.mjs
      - name: Packed files (manifest.json, api.md, /testing in every generated package)
        run: node scripts/check-pack.mjs
      - name: Built .d.ts typecheck with skipLibCheck off, public types not any
        run: node scripts/check-dts.mjs
      - name: Size budget (esbuild one-call bundle, gzip)
        run: node scripts/size-budget.mjs
      - name: Report final status on the head commit
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="$STATUS_CONTEXT" \
            -f target_url="$RUN_URL" -f description="CI $JOB_STATUS" >/dev/null

  # The built dist on every supported Node line (engines: >=20.3).
  dist-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    name: dist-smoke (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run codegen
      - run: pnpm run build
      - run: node scripts/smoke-dist.mjs
      - name: Core contract suite
        run: pnpm --filter @productcraft/core run test
