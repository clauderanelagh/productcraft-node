name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Bot branches (chore/refresh-specs from spec-refresh.yml, changeset-release/main
  # from release.yml) are pushed with GITHUB_TOKEN unless the SDK bot App is
  # configured. Those pushes don't trigger `pull_request` runs that execute
  # (they sit in action_required), so the bot workflows dispatch this workflow
  # on their branch explicitly. A PR's check rollup ignores workflow_dispatch
  # check suites, so a dispatched run also reports a `CI / build-and-test`
  # commit status on the head commit; that is what the PR shows.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    env:
      STATUS_CONTEXT: CI / build-and-test (dispatched)
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report pending status on the head commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context="$STATUS_CONTEXT" \
            -f target_url="$RUN_URL" -f description="CI running" >/dev/null
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run codegen
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test
      - name: Report final status on the head commit
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="$STATUS_CONTEXT" \
            -f target_url="$RUN_URL" -f description="CI $JOB_STATUS" >/dev/null
