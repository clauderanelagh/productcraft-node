name: Refresh OpenAPI specs

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  group: spec-refresh
  cancel-in-progress: false

# How the refresh PR gets CI (task 001, 2026-11-06):
#
# Pushes and PRs made with GITHUB_TOKEN don't start workflows that run (the
# PR's `pull_request` CI run sits in action_required), so the PR used to sit
# with no checks (#95, 2026-10-25 .. 2026-11-06).
#
#   - Preferred: the SDK bot GitHub App. Set repo variable SDK_BOT_APP_ID and
#     repo secret SDK_BOT_PRIVATE_KEY; the PR is then pushed with a
#     short-lived installation token (1 h, minted per run, nothing to expire
#     or rotate) and CI starts through the normal `pull_request` trigger.
#     Not configured yet: creating the App needs a GitHub web sign-in as the
#     repo owner.
#   - Fallback (used until the App exists): push with GITHUB_TOKEN, then
#     dispatch ci.yml on the PR branch (`workflow_dispatch` is an event that
#     GITHUB_TOKEN is allowed to trigger). Its checks land on the PR head.
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # dispatch ci.yml on the PR branch (fallback path)
    steps:
      - name: Mint SDK bot App token
        id: app-token
        if: vars.SDK_BOT_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.SDK_BOT_APP_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Fails the run (and opens no PR) when any API's /docs-json is
      # unreachable or not an OpenAPI document; see the script header.
      - name: Fetch latest specs
        run: bash scripts/refresh-specs.sh

      # codegen also rewrites the checked-in generator output (api.md, README
      # regions, examples/) and the API reports, so the PR carries them and
      # CI's "checked-in output is current" and api-report gates pass.
      - name: Regenerate types, docs and API reports
        run: |
          pnpm install --frozen-lockfile
          pnpm run codegen
          pnpm run build
          node scripts/api-report.mjs --update

      - name: Generate per-surface changesets for changed specs
        id: gen
        run: |
          set -euo pipefail
          changed=()
          for spec in Specs/*.json; do
            surface="$(basename "$spec" .json)"
            if ! git diff --quiet -- "$spec"; then
              echo "› spec changed: $surface"
              changed+=("$surface")
              cat > ".changeset/auto-spec-refresh-${surface}-${GITHUB_RUN_ID}.md" <<MD
          ---
          "@productcraft/${surface}": patch
          ---

          Refresh ${surface} OpenAPI types from production.
          MD
            fi
          done
          if (( ${#changed[@]} == 0 )); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "surfaces=${changed[*]}" >> "$GITHUB_OUTPUT"
          fi

      # A break is flagged two ways (sdk-standard section 7): oasdiff on the
      # spec, and removed lines in a public API report (type-level breaks
      # a spec diff can miss). Pinned binary, verified against its checksum.
      - name: Breaking-change check (oasdiff + API reports)
        id: breaking
        if: steps.gen.outputs.changed == 'true'
        env:
          OASDIFF_VERSION: "1.34.1"
          OASDIFF_SHA256: "75775f65b0adebd26a8e013af51a799342dfdc6262d89efa9e3b7bdf89657d90"
          SURFACES: ${{ steps.gen.outputs.surfaces }}
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/oasdiff.tar.gz"
          curl -fsSL -o "$tgz" "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" oasdiff
          breaking=false
          report="$RUNNER_TEMP/breaking.md"
          : > "$report"
          for surface in $SURFACES; do
            git show "HEAD:Specs/${surface}.json" > "$RUNNER_TEMP/base-${surface}.json"
            if ! "$RUNNER_TEMP/oasdiff" breaking "$RUNNER_TEMP/base-${surface}.json" "Specs/${surface}.json" --fail-on ERR > "$RUNNER_TEMP/oasdiff-${surface}.txt"; then
              breaking=true
              { echo "#### ${surface} (oasdiff)"; echo '```'; head -c 20000 "$RUNNER_TEMP/oasdiff-${surface}.txt"; echo '```'; } >> "$report"
            fi
          done
          removed="$(git diff --numstat -- 'packages/*/api-report.md' | awk '$2 > 0 { print $3 " (-" $2 ")" }')"
          if [[ -n "$removed" ]]; then
            breaking=true
            { echo "#### API reports with removed lines"; echo "$removed"; } >> "$report"
          fi
          echo "breaking=$breaking" >> "$GITHUB_OUTPUT"
          { echo "report<<EOF_REPORT"; cat "$report"; echo "EOF_REPORT"; } >> "$GITHUB_OUTPUT"

      - name: Open PR
        id: cpr
        if: steps.gen.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          commit-message: "chore(specs): refresh from production"
          title: "chore(specs): nightly refresh — ${{ steps.gen.outputs.surfaces }}"
          body: |
            Auto-generated PR from `.github/workflows/spec-refresh.yml`.

            Surfaces with spec changes this run: **${{ steps.gen.outputs.surfaces }}**

            A per-surface changeset entry was added under `.changeset/` —
            merging this PR will trigger the release workflow, which opens
            a "Version Packages" PR bumping only the affected packages.
            The `productcraft` umbrella picks up a patch via
            `updateInternalDependencies` in `.changeset/config.json`.

            Merge only on green CI.

            ${{ steps.breaking.outputs.breaking == 'true' && '**Breaking changes detected** (label `breaking`): check the semver bump before merging.' || 'No breaking change found by oasdiff or the API reports.' }}

            ${{ steps.breaking.outputs.report }}

            Specs refreshed from:
            - `https://api.platform-auth.productcraft.co/docs-json`
            - `https://api.auth.productcraft.co/docs-json`
            - `https://api.mail.productcraft.co/docs-json`
            - `https://social.productcraft.co/docs-json`
            - `https://api.waitlist.productcraft.co/docs-json`
            - `https://api.trawl.productcraft.co/docs-json`
          branch: chore/refresh-specs
          delete-branch: true
          labels: ${{ steps.breaking.outputs.breaking == 'true' && 'breaking' || '' }}

      - name: Clear a stale breaking label
        if: steps.cpr.outputs.pull-request-number != '' && steps.breaking.outputs.breaking != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: gh pr edit "${{ steps.cpr.outputs.pull-request-number }}" --repo "$GITHUB_REPOSITORY" --remove-label breaking 2>/dev/null || true

      - name: Run CI on the PR branch (no App token)
        if: steps.cpr.outputs.pull-request-number != '' && steps.cpr.outputs.pull-request-operation != 'none' && steps.app-token.outputs.token == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref chore/refresh-specs
          echo "Dispatched CI on chore/refresh-specs for PR #${{ steps.cpr.outputs.pull-request-number }}"
